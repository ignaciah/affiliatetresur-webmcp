<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AffiliateTresur - Agent-Native Deal Finder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 680px;
      width: 100%;
    }
    header {
      margin-bottom: 2rem;
      text-align: center;
    }
    h1 {
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--accent);
    }
    form {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: outline 0.2s ease, transform 0.2s ease;
    }
    /* WebMCP live agent interaction feedback */
    form:tool-form-active {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      transform: scale(1.01);
    }
    label {
      font-size: 0.85rem;
      color: var(--muted);
    }
    input {
      background: #0b1120;
      border: 1px solid #334155;
      color: var(--text);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.85rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #7dd3fc;
    }
    button:tool-submit-active {
      opacity: 0.7;
      cursor: wait;
    }
    #resultsContainer {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .deal-card {
      background: var(--card);
      padding: 1.25rem;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }
    .deal-card h3 {
      margin: 0 0 0.5rem 0;
    }
    .deal-meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .deal-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .deal-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">WebMCP Enabled</span>
      <h1>AffiliateTresur</h1>
      <p style="color: var(--muted);">AI-assisted deal discovery and affiliate recommendations</p>
    </header>

    <!-- Declarative WebMCP Form -->
    <form 
      id="dealSearchForm"
      toolname="search_affiliate_deals"
      tooldescription="Search affiliate offers, discounted tech, hardware, and accessories by keyword and optional budget limit"
      toolautosubmit
    >
      <div>
        <label for="query">Keywords / Category</label>
        <input 
          type="text" 
          id="query" 
          name="query" 
          placeholder="e.g., Raspberry Pi, standing desk, USB hub"
          required 
          toolparamdescription="Search keyword or product name"
        />
      </div>

      <div>
        <label for="maxPrice">Maximum Price ($ USD)</label>
        <input 
          type="number" 
          id="maxPrice" 
          name="maxPrice" 
          placeholder="e.g., 100"
          min="0"
          toolparamdescription="Optional maximum budget threshold in USD"
        />
      </div>

      <button type="submit" id="submitBtn">Search Deals</button>
    </form>

    <div id="resultsContainer"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
